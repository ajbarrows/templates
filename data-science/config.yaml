  ssh_host: "w3"   # alias from ~/.ssh/config
  base_path: "/users/a/j/ajbarrow/www-root/assets/uvm_internal"  # e.g. /var/www/html/projects
  base_url: "https://ajbarrow.w3.uvm.edu/assets/uvm_internal/"   # e.g. https://example.edu/projects
